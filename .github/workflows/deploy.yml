name: Deploy

on:
  push:
    branches:
      - main
      - initial
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "terraform/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: 'access_token'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{secrets.GCP_REGION}}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPOSITORY_ID }}/${{ secrets.ARTIFACT_REPOSITORY_ID }}:latest
        run: |
          # Verify repository exists
          gcloud artifacts repositories describe ${{ secrets.ARTIFACT_REPOSITORY_ID }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --location=${{ secrets.GCP_REGION }} || \
          gcloud artifacts repositories create ${{ secrets.ARTIFACT_REPOSITORY_ID }} \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --location=${{ secrets.GCP_REGION }} \
            --repository-format=docker

          docker build -t ${IMAGE_NAME} .
          docker push ${IMAGE_NAME}

      - name: Deploy to Cloud Run
        env:
          IMAGE_NAME: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPOSITORY_ID }}/${{ secrets.ARTIFACT_REPOSITORY_ID }}:latest
        run: |
          gcloud run deploy ilt-mock-data-lab \
            --image ${IMAGE_NAME} \
            --platform managed \
            --region europe-west1 \
            --project ${{ secrets.GCP_PROJECT_ID }}
